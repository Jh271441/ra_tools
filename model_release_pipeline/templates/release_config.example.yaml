runs_dir: ~/.ra_tools_runs
onnx_file_name: vectorized_scenario_remote_assist_model.onnx

luban:
  host_alias: luban_2_card
  python_bin: /home/luban/miniconda3/bin/conda run --no-capture-output -n scen_dnn python
  remote_python_bin: /home/luban/miniconda3/bin/conda run --no-capture-output -n scen_dnn python
  train_repo: /nfs/dataset-ofs-remote-assist-stuck/user/jasperchen/stuck_assist_model
  export_script: scenario_dnn/export/export_scenario_dnn.py
  offboard_config_path: configs/scenario_dnn_finetune_test.yaml
  offboard_entry_script: scenario_dnn/train_test/ra_model_pipeline.py

ifx:
  enabled: true
  method: jenkins
  truck_module: planner.model-files
  truck_cmd: truck.py
  # Where to run truck.py:
  # - auto: try local first, then docker, then ssh.
  # - local: current shell already has Voyager env and truck.py.
  # - docker: current shell is outside Voyager, truck.py is inside a local Voyager docker.
  # - ssh: truck.py is available after ssh to a cloud/server machine without docker.
  truck_runner: auto
  # Local use case: source Voyager setup in this shell before invoking truck.py.
  truck_local_shell: /bin/zsh
  truck_local_workdir: ""
  truck_local_setup: ""
  # Docker use case: export CONTAINER_NAME_GEN4, or set truck_docker_container explicitly.
  truck_docker_container: ""
  truck_docker_container_env: CONTAINER_NAME_GEN4
  truck_docker_shell: /bin/zsh
  truck_docker_workdir: /home/didi/workspace/voyager
  truck_docker_setup: git checkout master-Release_CN-a6d66b30c89 && source /home/didi/workspace/voyager/bazel/scripts/setup.sh
  truck_docker_stage_dir: /tmp/model_release_pipeline_artifacts
  # SSH use case: truck.py is on cloud_server under voyager or voyager2.
  truck_ssh_host: cloud_server
  truck_ssh_shell: /bin/zsh
  truck_ssh_workdir: /home/didi/workspace/voyager
  truck_ssh_setup: source /home/didi/workspace/voyager/bazel/scripts/setup.sh
  truck_ssh_stage_dir: /tmp/model_release_pipeline_artifacts
  jenkins_base_url: http://10.79.18.51:8088
  jenkins_job_name: voyager_ifxruntime_trt_cached_engines_generator_ov23_trt10_dev
  jenkins_http_method: POST
  jenkins_token: ONNX2IFX_DEV
  jenkins_use_crumb: true
  username: jasperchen
  max_batch: 0
  x86_convert: openvino
  precision_convert: FP16
  use_label: false
  label_prefix: scenario_dnn_release_
  precision_test_truck_arg: ""
  precision_test_local_path: ~/utils/ifx/ifx_fp32_after_scaling_pos1e1_5.zip
  precision_test_module: ifx-precision-test
  expected_platforms:
    - fp32_x86
    - fp16_6000
    - fp16_3060
    - fp16_gen4
    - fp16_thor
  poll_interval_sec: 30
  timeout_sec: 7200
  extra_params: {}

picker:
  policy: precision_first
  top_n: 3
  loss_tolerance_pct: 0.05

voyager:
  manifest_path: onboard/model_files/MANIFEST.txt
  commit_prefix: V
  return_branch: master-Release_CN-a6d66b30c89
  manifest_entries:
    - platform: onnx
      expected_name: vectorized_scenario_remote_assist_model.onnx
      target_path: ./planner_models/vectorized_scenario_remote_assist_model.onnx
      description: Vectorized scenario assist stuck model.
    - platform: fp32_x86
      expected_name: vectorized_scenario_remote_assist_model_bs0_fp32_x86.ifxmodel
      target_path: ./planner_models/vectorized_scenario_remote_assist_model_x86.ifxmodel
    - platform: fp16_6000
      expected_name: vectorized_scenario_remote_assist_model_bs0_fp16_6000_trt109.ifxmodel
      target_path: ./planner_models/vectorized_scenario_remote_assist_model_fp16_6000.ifxmodel
    - platform: fp16_3060
      expected_name: vectorized_scenario_remote_assist_model_bs0_fp16_3060_trt109.ifxmodel
      target_path: ./planner_models/vectorized_scenario_remote_assist_model_fp16_3060.ifxmodel
    - platform: fp16_gen4
      expected_name: vectorized_scenario_remote_assist_model_bs0_fp16_gen4_trt109.ifxmodel
      target_path: ./planner_models/vectorized_scenario_remote_assist_model_fp16_gen4.ifxmodel
    - platform: fp16_thor
      expected_name: vectorized_scenario_remote_assist_model_bs0_fp16_thor_trt1013.ifxmodel
      target_path: ./planner_models/vectorized_scenario_remote_assist_model_fp16_thor.ifxmodel
  branches:

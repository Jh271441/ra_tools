<!doctype html>
<html lang="zh-CN" data-ui-lang="zh" data-color-theme="dark" data-session-pending="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="ra-triage-base" content="{{RA_TRIAGE_BASE_PATH}}" />
    <title>Manual Triage Workbench</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='17' fill='%230d1119'/><g fill='%2324d3ef'><circle cx='16' cy='18' r='4'/><circle cx='16' cy='32' r='4'/><circle cx='16' cy='46' r='4'/></g><path d='M20 18h7l7 14m-14 0h14m-14 14h7l7-14' fill='none' stroke='%2388a4b4' stroke-width='4' stroke-linecap='round'/><path d='m35 34 6 6 11-14' fill='none' stroke='%23edf2fb' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <script>
      (() => {
        let theme = "dark";
        let lang = "zh";
        try {
          theme = localStorage.getItem("ra-triage-color-theme") === "light" ? "light" : "dark";
          lang = localStorage.getItem("ra-triage-ui-language") === "en" ? "en" : "zh";
          if (localStorage.getItem("ra-triage-sidebar-collapsed") === "true") {
            document.documentElement.dataset.sidebarPref = "collapsed";
          }
          const sidebarWidth = Number(localStorage.getItem("ra-triage-sidebar-width"));
          if (Number.isFinite(sidebarWidth) && sidebarWidth >= 190 && sidebarWidth <= 420) {
            document.documentElement.style.setProperty("--app-sidebar-width", `${sidebarWidth}px`);
          }
          const reviewPaneWidth = Number(localStorage.getItem("ra-triage-review-pane-width"));
          if (Number.isFinite(reviewPaneWidth) && reviewPaneWidth >= 304 && reviewPaneWidth <= 600) {
            document.documentElement.style.setProperty("--review-pane-width", `${reviewPaneWidth}px`);
          }
          if (localStorage.getItem("ra-triage-can-view-intent") === "true") {
            document.documentElement.dataset.canViewIntent = "true";
          }
        } catch (_error) {
          // Storage can be unavailable in hardened browser contexts.
        }
        if (typeof window.matchMedia === "function" && window.matchMedia("(max-width: 1200px)").matches) {
          document.documentElement.dataset.sidebarPref = "collapsed";
        }
        document.documentElement.dataset.colorTheme = theme;
        document.documentElement.dataset.uiLang = lang;
        document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
      })();
    </script>
    <style>
      html { background: #0b0e14; color-scheme: dark; }
      html[data-color-theme="light"] { background: #f6f8fb; color-scheme: light; }
      html.ra-styles-loading body { visibility: hidden; }
    </style>
    <script>
      (() => {
        const loadingClass = "ra-styles-loading";
        document.documentElement.classList.add(loadingClass);
        const configuredBase = document.querySelector('meta[name="ra-triage-base"]')?.content || "";
        const activeBase = configuredBase && (
          window.location.pathname === configuredBase ||
          window.location.pathname.startsWith(`${configuredBase}/`)
        ) ? configuredBase : "";
        window.__RA_TRIAGE_BASE__ = activeBase;
        const stylesheetPaths = [
          "styles.css",
          "css/base.css",
          "css/layout-shared.css",
          "css/trail-update.css",
          "css/trail-history.css",
          "css/review-comment.css",
          "css/case-labeling.css",
          "css/assignment-composer.css",
          "css/analysis.css",
          "css/intent-labeling.css",
          "css/media-dialog.css",
          "css/comparison.css",
          "css/batch-gateway.css",
          "css/runs.css",
          "css/campaigns.css",
          "css/labeling-summary.css",
          "css/daily-cron.css",
          "css/daily-review.css",
          "css/version-datasets.css",
          "css/version-metrics.css",
          "css/mobile.css",
        ];
        const stylesheetRequests = ["app-bundle.css"];
        let stylesSettled = false;
        let pendingStyles = stylesheetRequests.length;
        const revealShell = () => {
          if (stylesSettled) return;
          stylesSettled = true;
          document.documentElement.classList.remove(loadingClass);
        };
        const settleStylesheet = () => {
          pendingStyles -= 1;
          if (pendingStyles === 0) revealShell();
        };
        stylesheetRequests.forEach((path) => {
          const styles = document.createElement("link");
          styles.rel = "stylesheet";
          styles.href = `${activeBase}/static/${path}?v=manual-triage-883`;
          styles.addEventListener("load", settleStylesheet, { once: true });
          styles.addEventListener("error", settleStylesheet, { once: true });
          document.head.appendChild(styles);
        });
        window.setTimeout(revealShell, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="raWorkbenchRoot"></div>
    <script id="raViteAssets" type="application/json">{{RA_TRIAGE_VITE_ASSETS}}</script>
    <script>
      (() => {
        const raw = document.getElementById("raViteAssets")?.textContent || "{}";
        let assets = { js: [], css: [] };
        try {
          assets = JSON.parse(raw);
        } catch (_err) {
          return;
        }
        const base = window.__RA_TRIAGE_BASE__ || "";
        for (const cssPath of assets.css || []) {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = `${base}/static/dist/${cssPath}`;
          document.head.appendChild(link);
        }
        for (const jsPath of assets.js || []) {
          const script = document.createElement("script");
          script.type = "module";
          script.src = `${base}/static/dist/${jsPath}`;
          document.body.appendChild(script);
        }
      })();
    </script>
  </body>
</html>

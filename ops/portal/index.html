<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RA Tools</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />
  <script>
    (() => {
      const root = document.documentElement;
      const system = window.matchMedia('(prefers-color-scheme: dark)');
      const modes = ['system', 'light', 'dark'];
      const colors = ['blue', 'green', 'violet', 'orange'];
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem('ra-portal-appearance') || '{}') || {}; } catch (_) {}
      const state = {
        mode: modes.includes(saved.mode) ? saved.mode : 'system',
        color: colors.includes(saved.color) ? saved.color : 'blue',
      };
      function apply() {
        root.dataset.theme = state.mode === 'system' ? (system.matches ? 'dark' : 'light') : state.mode;
        root.dataset.color = state.color;
      }
      window.portalAppearance = {
        state,
        set(key, value) {
          if (!(key === 'mode' ? modes : key === 'color' ? colors : []).includes(value)) return;
          state[key] = value;
          apply();
          try { localStorage.setItem('ra-portal-appearance', JSON.stringify(state)); } catch (_) {}
        },
      };
      system.addEventListener('change', apply);
      apply();
    })();
  </script>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #6e6e73;
      --border: #e3e3e6;
      --accent: #0a84ff;
    }
    :root { color-scheme: light; --accent: #0066cc; }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #101114; --card: #1b1c1f; --text: #f2f2f4;
      --muted: #a3a3ac; --border: #35353c; --accent: #69b0ff;
    }
    :root[data-color="green"] { --accent: #18734a; }
    :root[data-color="violet"] { --accent: #7740bd; }
    :root[data-color="orange"] { --accent: #aa4b06; }
    :root[data-theme="dark"][data-color="green"] { --accent: #69dba4; }
    :root[data-theme="dark"][data-color="violet"] { --accent: #c19aff; }
    :root[data-theme="dark"][data-color="orange"] { --accent: #ffb16f; }
    .appearance {
      position: absolute; top: 24px; right: 28px;
      display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 20px;
    }
    .appearance-group { display: flex; align-items: center; gap: 10px; }
    .appearance-label { color: var(--muted); font-size: 12px; }
    .mode-options { display: flex; gap: 2px; padding: 3px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
    .appearance button { font: inherit; cursor: pointer; }
    .mode-options button { border: 0; border-radius: 7px; padding: 7px 10px; background: transparent; color: var(--muted); font-size: 12px; min-height: 32px; }
    .mode-options button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .mode-options button:hover { color: var(--text); }
    .color-options { display: flex; gap: 4px; }
    .color-options button { display: grid; place-items: center; width: 32px; height: 32px; border: 2px solid transparent; border-radius: 50%; padding: 4px; background: transparent; }
    .color-options button::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--swatch); }
    .color-options button[aria-pressed="true"] { border-color: var(--text); }
    .color-options button:hover { background: var(--border); }
    .appearance button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 540px) {
      .appearance { top: 16px; right: 16px; left: 16px; gap: 10px 16px; }
    }
    @media (prefers-reduced-motion: reduce) { a.card { transition: none; } }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 16px 32px;
    }
    @media (max-width: 540px) { body { padding-top: 140px; } }
    .wrap { width: 100%; max-width: 880px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
    }
    a.card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    a.card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }
    a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .card .name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .card .desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .card .path {
      display: inline-block;
      margin-top: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--accent);
    }
    .tag {
      display: inline-block;
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 8px;
      margin-left: 6px;
      vertical-align: 2px;
    }
    footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="appearance" role="group" aria-label="首页外观">
    <div class="appearance-group" role="group" aria-label="外观">
      <span class="appearance-label">外观</span>
      <div class="mode-options">
        <button type="button" data-mode="system" aria-pressed="false">跟随系统</button>
        <button type="button" data-mode="light" aria-pressed="false">浅色</button>
        <button type="button" data-mode="dark" aria-pressed="false">深色</button>
      </div>
    </div>
    <div class="appearance-group" role="group" aria-label="主题色">
      <span class="appearance-label">主题色</span>
      <div class="color-options">
        <button type="button" data-color="blue" aria-label="海蓝" title="海蓝" aria-pressed="false" style="--swatch: #409cff"></button>
        <button type="button" data-color="green" aria-label="松绿" title="松绿" aria-pressed="false" style="--swatch: #38b87c"></button>
        <button type="button" data-color="violet" aria-label="鸢紫" title="鸢紫" aria-pressed="false" style="--swatch: #a779ec"></button>
        <button type="button" data-color="orange" aria-label="琥珀" title="琥珀" aria-pressed="false" style="--swatch: #ee964a"></button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <h1>RA Tools</h1>
    <div class="sub">选择工作台，开始查看与分析。</div>
    <div class="grid">
      <a class="card" href="/manual/">
        <div class="name">人工评审 <span class="tag">Manual</span></div>
        <div class="desc">浏览路测 Case，查看模型结果，完成问题评审与标注。</div>
        <span class="path">/manual/ <span aria-hidden="true">→</span></span>
      </a>
      <a class="card" href="/sim/overview">
        <div class="name">仿真复现 <span class="tag">Simulation</span></div>
        <div class="desc">查看 release 仿真复现率、准召指标和 Issue / Scenario 明细。</div>
        <span class="path">/sim/ <span aria-hidden="true">→</span></span>
      </a>
    </div>
    <footer>RA Tools · 评审与仿真的统一入口</footer>
  </div>
  <script>
    for (const key of ['mode', 'color']) {
      const buttons = document.querySelectorAll(`button[data-${key}]`);
      const sync = () => buttons.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset[key] === window.portalAppearance.state[key]));
      });
      buttons.forEach(button => button.addEventListener('click', () => {
        window.portalAppearance.set(key, button.dataset[key]);
        sync();
      }));
      sync();
    }
  </script>
</body>
</html>

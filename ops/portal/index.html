<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RA Tools</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #6e6e73;
      --border: #e3e3e6;
      --accent: #0a84ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101114;
        --card: #1b1c1f;
        --text: #f2f2f4;
        --muted: #98989f;
        --border: #2c2d31;
        --accent: #409cff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .wrap { width: 100%; max-width: 880px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
    }
    a.card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    a.card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }
    a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .card .name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .card .desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .card .path {
      display: inline-block;
      margin-top: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--accent);
    }
    .tag {
      display: inline-block;
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 8px;
      margin-left: 6px;
      vertical-align: 2px;
    }
    footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>RA Tools</h1>
    <div class="sub">选择工作台，开始查看与分析。</div>
    <div class="grid">
      <a class="card" href="/manual/">
        <div class="name">人工评审 <span class="tag">Manual</span></div>
        <div class="desc">浏览路测 Case，查看模型结果，完成问题评审与标注。</div>
        <span class="path">/manual/ <span aria-hidden="true">→</span></span>
      </a>
      <a class="card" href="/sim/overview">
        <div class="name">仿真复现 <span class="tag">Simulation</span></div>
        <div class="desc">查看 release 仿真复现率、准召指标和 Issue / Scenario 明细。</div>
        <span class="path">/sim/ <span aria-hidden="true">→</span></span>
      </a>
    </div>
    <footer>RA Tools · 评审与仿真的统一入口</footer>
  </div>
</body>
</html>
